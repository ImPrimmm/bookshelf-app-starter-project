<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookshelf App</title>
    <link rel="stylesheet" href="./style.css" />
    <script defer src="main.js"></script>
  </head>
  <body id="myBody">
    <div class="container">
      <header>
        <h1>Bookshelf App</h1>
      </header>

      <main>
        <section>
          <h2>Tambah Buku Baru</h2>
          <form id="bookForm" data-testid="bookForm">
            <div class="content">
              <label for="bookFormTitle">Judul</label>
              <input
                id="bookFormTitle"
                type="text"
                required
                data-testid="bookFormTitleInput"
              />
            </div>
            <div class="content">
              <label for="bookFormAuthor">Penulis</label>
              <input
                id="bookFormAuthor"
                type="text"
                required
                data-testid="bookFormAuthorInput"
              />
            </div>
            <div class="content">
              <label for="bookFormYear">Tahun</label>
              <input
                id="bookFormYear"
                type="number"
                required
                data-testid="bookFormYearInput"
              />
            </div>
            <div class="footerContent">
              <label for="bookFormIsComplete">Selesai dibaca</label>
              <input
                id="bookFormIsComplete"
                type="checkbox"
                data-testid="bookFormIsCompleteCheckbox"
              />
            </div>
            <button
              id="bookFormSubmit"
              type="submit"
              data-testid="bookFormSubmitButton"
              class="button1 btn-create"
            >
              Masukkan Buku ke rak
              <span id="buttonSpan">Belum selesai dibaca</span>
            </button>
          </form>
        </section>

        <section class="search">
          <h2>Cari Buku</h2>
          <form id="searchBook" data-testid="searchBookForm">
            <label for="searchBookTitle">Judul</label>
            <div class="contentInputSearch">
              <input
                id="searchBookTitle"
                type="text"
                data-testid="searchBookFormTitleInput"
              />
              <button
                id="searchSubmit"
                type="submit"
                data-testid="searchBookFormSubmitButton"
                class="button1"
              >
                Cari
              </button>
              <div id="result">
                <h3 data-testid="bookItemTitle" id="resultTitle"></h3>
                <p data-testid="bookItemAuthor" id="resultAuthor"></p>
                <p data-testid="bookItemYear" id="resultYear"></p>
                <p data-testid="bookItemIsCompleted" id="resultIsCompleted"></p>
              </div>
            </div>
          </form>
        </section>

        <section>
          <h2>Belum selesai dibaca</h2>
          <div id="incompleteBookList" data-testid="incompleteBookList">
            <div
              id="containerUnCompleteBookList"
              class="containerUnCompleteBookList"
            ></div>
          </div>
        </section>

        <section>
          <h2>Selesai dibaca</h2>
          <div id="completeBookList" data-testid="completeBookList">
            <div
              id="containerCompleteBookList"
              class="containerCompleteBookList"
            ></div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
